<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIA Secondary — Digital Platforms | المنصات الرقمية</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --aia-dark: #5C1A1A;
    --aia-navy: #1B3A5C;
    --aia-blue: #3A7DB5;
    --aia-blue-lt: #7AB3D8;
    --aia-gold: #D4A017;
    --aia-cream: #FDF9F4;
    --aia-border: rgba(92,26,26,0.15);
    --text-main: #1a1a1a;
    --text-muted: #555;
    --bg-light: #f5f5f5;
  }

  body {
    font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
    background: #e8e4de;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 16px;
  }

  .slide {
    width: 100%;
    max-width: 960px;
    background: var(--aia-cream);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }

  .top-bar {
    background: var(--aia-navy);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .top-left { display: flex; align-items: center; gap: 14px; }
  .logo-circle {
    width: 48px; height: 48px; border-radius: 50%;
    background: transparent; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; overflow: hidden;
  }
  .logo-fallback {
    width: 44px; height: 44px; background: #1B3A5C; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 12px; letter-spacing: 0.05em;
  }
  .top-titles .en {
    color: white; font-size: 16px; font-weight: 600;
    font-family: 'Playfair Display', serif;
  }
  .top-titles .ar { color: var(--aia-blue-lt); font-size: 13px; direction: rtl; margin-top: 2px; }

  .mode-btns { display: flex; gap: 8px; }
  .mode-btn {
    padding: 6px 16px; border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: transparent; color: rgba(255,255,255,0.75);
    font-size: 13px; cursor: pointer; transition: all 0.18s;
    font-family: 'Source Sans 3', sans-serif;
  }
  .mode-btn:hover { background: rgba(255,255,255,0.1); color: white; }
  .mode-btn.active {
    background: var(--aia-gold); color: #2a1800;
    border-color: var(--aia-gold); font-weight: 600;
  }

  .main { display: grid; grid-template-columns: 220px 1fr; min-height: 560px; }

  .sidebar {
    background: var(--aia-navy);
    border-right: 4px solid var(--aia-gold);
    padding: 14px 0;
    overflow-y: auto;
  }
  .sidebar-label {
    color: var(--aia-blue-lt); font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0 16px 10px; font-weight: 600;
  }
  .sidebar-section-divider {
    color: var(--aia-gold); font-size: 9px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 10px 16px 4px; font-weight: 700;
    border-top: 1px solid rgba(255,255,255,0.1);
    margin-top: 4px;
  }
  .tool-btn {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; cursor: pointer; border: none;
    background: transparent; color: rgba(255,255,255,0.65);
    font-family: 'Source Sans 3', sans-serif; font-size: 13px;
    text-align: left; border-left: 3px solid transparent;
    transition: all 0.18s;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.08); color: white; }
  .tool-btn.active {
    background: rgba(255,255,255,0.12); color: white;
    border-left-color: var(--aia-gold);
  }
  .btn-icon {
    width: 30px; height: 30px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }

  .sidebar-logo {
    width: 30px; height: 30px; border-radius: 6px;
    object-fit: contain; background: white;
    padding: 3px; flex-shrink: 0;
  }
  .btn-en { display: block; font-weight: 500; font-size: 12px; }
  .btn-ar { display: block; font-size: 10px; opacity: 0.6; direction: rtl; margin-top: 1px; }


  .plat-logo {
    width: 52px; height: 52px; border-radius: 12px;
    object-fit: contain; background: white;
    padding: 4px; flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
  }

  .view-panel { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }

  .view-header {
    display: flex; align-items: flex-start; gap: 16px;
    padding-bottom: 16px; border-bottom: 1.5px solid var(--aia-border);
  }
  .view-icon {
    width: 58px; height: 58px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .view-name-en {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700; color: var(--aia-dark); line-height: 1.1;
  }
  .view-name-ar { font-size: 16px; color: var(--aia-navy); direction: rtl; margin-top: 4px; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 3px 12px; border-radius: 20px; margin-top: 6px;
    letter-spacing: 0.04em;
  }
  .visit-btn {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 10px; padding: 7px 16px; border-radius: 8px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: none; color: white;
    font-family: 'Source Sans 3', sans-serif;
    transition: opacity 0.15s, transform 0.12s;
  }
  .visit-btn:hover { opacity: 0.82; transform: translateY(-1px); }

  .bilingual-block { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lang-card { border-radius: 10px; padding: 12px 14px; }
  .lang-card.en-card { background: rgba(27,58,92,0.06); border-left: 3px solid var(--aia-navy); }
  .lang-card.ar-card { background: rgba(92,26,26,0.06); border-right: 3px solid var(--aia-dark); direction: rtl; text-align: right; }
  .lang-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .en-card .lang-label { color: var(--aia-navy); }
  .ar-card .lang-label { color: var(--aia-dark); }
  .lang-text { font-size: 13px; color: var(--text-muted); line-height: 1.65; }

  .steps-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .step-card {
    background: white; border: 1px solid rgba(92,26,26,0.1);
    border-radius: 10px; padding: 12px 14px;
  }
  .step-num { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 3px; }
  .step-en { font-size: 13px; font-weight: 600; color: var(--aia-navy); }
  .step-body-en { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
  .step-ar { font-size: 12px; font-weight: 500; color: var(--aia-dark); direction: rtl; text-align: right; margin-top: 6px; }
  .step-body-ar { font-size: 11px; color: var(--text-muted); direction: rtl; text-align: right; margin-top: 2px; line-height: 1.4; }

  .tip-bar {
    background: rgba(212,160,23,0.1); border-radius: 10px;
    padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start;
    border-left: 3px solid var(--aia-gold);
  }
  .tip-label { font-size: 11px; font-weight: 700; color: #854F0B; white-space: nowrap; }
  .tip-content { flex: 1; }
  .tip-en { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .tip-ar { font-size: 12px; color: var(--text-muted); direction: rtl; text-align: right; margin-top: 4px; line-height: 1.5; }

  .edit-panel {
    padding: 16px 20px; display: flex; flex-direction: column;
    gap: 12px; background: #f0ede8; overflow-y: auto;
  }
  .edit-section {
    background: white; border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.08); overflow: hidden;
  }
  .edit-sec-header {
    padding: 9px 14px; background: var(--aia-navy);
    color: white; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .edit-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted); }
  .field-label.ar { direction: rtl; text-align: right; }
  .edit-input {
    border: 1.5px solid #ddd; border-radius: 7px;
    padding: 7px 10px; font-size: 13px; width: 100%;
    background: white; color: var(--text-main);
    font-family: 'Source Sans 3', sans-serif; resize: vertical;
    transition: border-color 0.15s;
  }
  .edit-input:focus { outline: none; border-color: var(--aia-blue); }
  .edit-input.rtl { direction: rtl; text-align: right; }
  textarea.edit-input { min-height: 70px; }

  .emoji-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .emoji-pick {
    font-size: 22px; cursor: pointer; padding: 3px 5px;
    border-radius: 6px; border: 2px solid transparent; transition: all 0.12s;
  }
  .emoji-pick:hover { background: rgba(212,160,23,0.12); }
  .emoji-pick.sel { border-color: var(--aia-gold); background: rgba(212,160,23,0.15); }

  .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .color-pick {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: all 0.15s;
  }
  .color-pick:hover { transform: scale(1.1); }
  .color-pick.sel { outline: 3px solid var(--aia-gold); outline-offset: 2px; }

  .steps-edit { display: flex; flex-direction: column; gap: 10px; }
  .step-edit-item { background: #f8f6f2; border-radius: 8px; padding: 12px; }
  .step-edit-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--aia-navy); margin-bottom: 8px; }

  .save-btn {
    background: var(--aia-navy); color: white; border: none;
    border-radius: 10px; padding: 12px 24px; font-size: 14px;
    font-weight: 600; cursor: pointer; width: 100%;
    font-family: 'Source Sans 3', sans-serif; transition: opacity 0.15s;
    letter-spacing: 0.02em;
  }
  .save-btn:hover { opacity: 0.85; }

  .footer-bar {
    background: var(--aia-dark); padding: 9px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .footer-bar span { color: rgba(255,255,255,0.5); font-size: 11px; letter-spacing: 0.04em; }
  .footer-dots { display: flex; gap: 5px; }
  .fdot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background 0.2s; }
  .fdot.active { background: var(--aia-gold); }

  @media (max-width: 640px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 4px solid var(--aia-gold); padding: 10px 0; }
    .bilingual-block { grid-template-columns: 1fr; }
    .steps-grid { grid-template-columns: 1fr; }
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>

function setMode(m) {
  mode = m;
  document.getElementById('btn-view').className = 'mode-btn' + (m==='view'?' active':'');
  document.getElementById('btn-edit').className = 'mode-btn' + (m==='edit'?' active':'');
  render(active);
}

function buildSidebar() {
  const list = document.getElementById('tool-list');
  const dotsCont = document.getElementById('footer-dots');
  list.innerHTML = '';
  dotsCont.innerHTML = '';

  sidebarSections.forEach(section => {
    const divider = document.createElement('div');
    divider.className = 'sidebar-section-divider';
    divider.textContent = section.label;
    list.appendChild(divider);
    section.indices.forEach(i => {
      const t = tools[i];
      const btn = document.createElement('button');
      btn.className = 'tool-btn' + (i === active ? ' active' : '');
      btn.innerHTML = platformLogos[i]
      ? `<img src="${platformLogos[i]}" class="sidebar-logo" alt="${t.nameEn}" /><div><span class="btn-en">${t.nameEn}</span><span class="btn-ar">${t.nameAr}</span></div>`
      : `<div class="btn-icon" style="background:${t.colorLight};color:${t.colorText}">${t.emoji}</div><div><span class="btn-en">${t.nameEn}</span><span class="btn-ar">${t.nameAr}</span></div>`;
      btn.onclick = () => { active = i; buildSidebar(); render(i); };
      list.appendChild(btn);
    });
  });

  tools.forEach((t, i) => {
    const dot = document.createElement('div');
    dot.className = 'fdot' + (i === active ? ' active' : '');
    dotsCont.appendChild(dot);
  });
}

function render(idx) {
  const t = tools[idx];
  const panel = document.getElementById('detail');
  if (mode === 'view') {
    const urlDisplay = t.url ? t.url.replace('https://www.','').replace('https://','') : '';
    panel.innerHTML = `<div class="view-panel">
      <div class="view-header">
        ${platformLogos[idx] ? `<img src="${platformLogos[idx]}" class="plat-logo" alt="${t.nameEn} logo" />` : `<div class="view-icon" style="background:${t.colorLight};color:${t.colorText}">${t.emoji}</div>`}
        <div>
          <div class="view-name-en">${t.nameEn}</div>
          <div class="view-name-ar">${t.nameAr}</div>
          <span class="badge" style="background:${t.colorLight};color:${t.colorText}">${t.subjectEn} · ${t.subjectAr}</span>
          ${t.url ? `<br><a href="${t.url}" target="_blank" class="visit-btn" style="background:${t.color};">🔗 ${urlDisplay} · زيارة الموقع</a>` : ''}
        </div>
      </div>
      <div class="bilingual-block">
        <div class="lang-card en-card">
          <div class="lang-label">English</div>
          <div class="lang-text">${t.descEn}</div>
        </div>
        <div class="lang-card ar-card">
          <div class="lang-label">العربية</div>
          <div class="lang-text">${t.descAr}</div>
        </div>
      </div>
      <div class="steps-grid">
        ${t.steps.map(s => `<div class="step-card">
          <div class="step-num" style="color:${t.colorText}">${s.numEn}</div>
          <div class="step-en">${s.titleEn}</div>
          <div class="step-body-en">${s.bodyEn}</div>
          <div class="step-ar">${s.titleAr}</div>
          <div class="step-body-ar">${s.bodyAr}</div>
        </div>`).join('')}
      </div>
      <div class="tip-bar">
        <div class="tip-label">💡 Tip</div>
        <div class="tip-content">
          <div class="tip-en">${t.tipEn}</div>
          <div class="tip-ar">${t.tipAr}</div>
        </div>
      </div>
    </div>`;
  } else {
    panel.innerHTML = `<div class="edit-panel">
      <div class="edit-section">
        <div class="edit-sec-header">🏷️ Platform identity | هوية المنصة</div>
        <div class="edit-body">
          <div class="field-row">
            <div class="field-group"><div class="field-label">Name (English)</div><input type="text" class="edit-input" id="f-nameEn" value="${t.nameEn}"></div>
            <div class="field-group"><div class="field-label ar">الاسم (عربي)</div><input type="text" class="edit-input rtl" id="f-nameAr" value="${t.nameAr}"></div>
          </div>
          <div class="field-row">
            <div class="field-group"><div class="field-label">Subject label (EN)</div><input type="text" class="edit-input" id="f-subjectEn" value="${t.subjectEn}"></div>
            <div class="field-group"><div class="field-label ar">تسمية المادة (ع)</div><input type="text" class="edit-input rtl" id="f-subjectAr" value="${t.subjectAr}"></div>
          </div>
          <div class="field-row">
            <div class="field-group"><div class="field-label">Tag (EN)</div><input type="text" class="edit-input" id="f-tagEn" value="${t.tagEn}"></div>
            <div class="field-group"><div class="field-label ar">التصنيف (ع)</div><input type="text" class="edit-input rtl" id="f-tagAr" value="${t.tagAr}"></div>
          </div>
          <div class="field-group"><div class="field-label">Website URL</div><input type="text" class="edit-input" id="f-url" value="${t.url || ''}"></div>
          <div class="field-group"><div class="field-label">Icon</div>
            <div class="emoji-row">${emojis.map(e => `<span class="emoji-pick${e===t.emoji?' sel':''}" onclick="pickEmoji('${e}',this)">${e}</span>`).join('')}</div>
          </div>
          <div class="field-group"><div class="field-label">Colour theme</div>
            <div class="color-row">${colors.map((c,ci) => `<div class="color-pick${c.v===t.color?' sel':''}" style="background:${c.v}" title="${c.label}" onclick="pickColor(${ci},this)"></div>`).join('')}</div>
          </div>
        </div>
      </div>
      <div class="edit-section">
        <div class="edit-sec-header">📄 Description | الوصف</div>
        <div class="edit-body">
          <div class="field-group"><div class="field-label">English</div><textarea class="edit-input" id="f-descEn">${t.descEn}</textarea></div>
          <div class="field-group"><div class="field-label ar">العربية</div><textarea class="edit-input rtl" id="f-descAr">${t.descAr}</textarea></div>
        </div>
      </div>
      <div class="edit-section">
        <div class="edit-sec-header">📋 Steps | الخطوات</div>
        <div class="edit-body">
          <div class="steps-edit">
            ${t.steps.map((s,si) => `<div class="step-edit-item">
              <div class="step-edit-label">Step ${si+1} — ${s.numEn}</div>
              <div class="field-row">
                <div class="field-group"><div class="field-label">Title (EN)</div><input type="text" class="edit-input" id="f-s${si}-tEn" value="${s.titleEn}"></div>
                <div class="field-group"><div class="field-label ar">العنوان (ع)</div><input type="text" class="edit-input rtl" id="f-s${si}-tAr" value="${s.titleAr}"></div>
              </div>
              <div class="field-row">
                <div class="field-group"><div class="field-label">Detail (EN)</div><input type="text" class="edit-input" id="f-s${si}-bEn" value="${s.bodyEn}"></div>
                <div class="field-group"><div class="field-label ar">التفاصيل (ع)</div><input type="text" class="edit-input rtl" id="f-s${si}-bAr" value="${s.bodyAr}"></div>
              </div>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="edit-section">
        <div class="edit-sec-header">💡 Tip | نصيحة</div>
        <div class="edit-body">
          <div class="field-group"><div class="field-label">English</div><textarea class="edit-input" id="f-tipEn">${t.tipEn}</textarea></div>
          <div class="field-group"><div class="field-label ar">العربية</div><textarea class="edit-input rtl" id="f-tipAr">${t.tipAr}</textarea></div>
        </div>
      </div>
      <button class="save-btn" onclick="saveChanges()">✅ Save changes · حفظ التغييرات</button>
    </div>`;
  }
}

function pickEmoji(e, el) {
  document.querySelectorAll('.emoji-pick').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  tools[active].emoji = e;
}

function pickColor(ci, el) {
  document.querySelectorAll('.color-pick').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  const c = colors[ci];
  tools[active].color = c.v;
  tools[active].colorLight = c.l;
  tools[active].colorText = c.t;
}

function saveChanges() {
  const t = tools[active];
  t.nameEn = document.getElementById('f-nameEn').value;
  t.nameAr = document.getElementById('f-nameAr').value;
  t.subjectEn = document.getElementById('f-subjectEn').value;
  t.subjectAr = document.getElementById('f-subjectAr').value;
  t.tagEn = document.getElementById('f-tagEn').value;
  t.tagAr = document.getElementById('f-tagAr').value;
  t.url = document.getElementById('f-url').value;
  t.descEn = document.getElementById('f-descEn').value;
  t.descAr = document.getElementById('f-descAr').value;
  t.tipEn = document.getElementById('f-tipEn').value;
  t.tipAr = document.getElementById('f-tipAr').value;
  t.steps.forEach((s, si) => {
    s.titleEn = document.getElementById(`f-s${si}-tEn`).value;
    s.titleAr = document.getElementById(`f-s${si}-tAr`).value;
    s.bodyEn = document.getElementById(`f-s${si}-bEn`).value;
    s.bodyAr = document.getElementById(`f-s${si}-bAr`).value;
  });
  buildSidebar();
  setMode('view');
}

buildSidebar();
render(0);
</script>
